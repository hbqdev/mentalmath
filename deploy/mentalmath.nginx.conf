# Mental Math Trainer: static site served by nginx on this host.
# Installed by scripts/deploy.sh as /etc/nginx/sites-available/mentalmath.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/mentalmath;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    types {
        application/manifest+json webmanifest;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Book figures and icons change only with a redeploy; the service worker precaches them.
    location ~ ^/(book|icons)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The shell, the worker and the manifest must always be revalidated so updates land.
    location ~ ^/(index\.html|sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes (/read/1, /practice/...) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
