<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fallback for browsers that don't support SVG favicons -->
    <link rel="alternate icon" href="/icons/icon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MentalMath" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mental Math Trainer</title>
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme and text size before the first paint so the page never flashes.
      ;(function () {
        try {
          var raw = localStorage.getItem('mentalmath.v1')
          var s = raw ? JSON.parse(raw).settings || {} : {}
          var theme =
            s.theme === 'light' || s.theme === 'bright' || s.theme === 'dark'
              ? s.theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          var px = Math.min(24, Math.max(14, Math.round(Number(s.fontSize) || 18)))
          document.documentElement.style.setProperty('--body-size', px + 'px')
          document.documentElement.dataset.font =
            ['serif', 'sans', 'system', 'mono'].indexOf(s.font) >= 0 ? s.font : 'serif'
        } catch (e) {
          /* storage unavailable: the app applies the theme after mount */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
