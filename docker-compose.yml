# Run the Mental Math Trainer web app as a container.
#   docker compose up -d              -> http://localhost:8547
#   PORT=9000 docker compose up -d    -> http://localhost:9000
services:
  mentalmath:
    image: mentalmath:latest
    build: .
    container_name: mentalmath
    restart: unless-stopped
    ports:
      - '${PORT:-8547}:8547'
